# 우리집 책장 v3 : FastAPI(api) + Streamlit(web) + PostgreSQL(db) 세 컨테이너를 함께 실행하기 위한 설정 파일
services:
  api:
    build: . # 현재 폴더의 Dockerfile을 기준으로 이미지 빌드
    container_name: booklib-api

    ports:
      - "8000:8000" # "호스트포트:컨테이너포트"

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    env_file:
      - .env

    volumes:
      # "내 컴퓨터 경로:컨테이너 경로"
      # 컨테이너가 삭제되어도 표지 이미지 파일이 내 컴퓨터의 uploads폴더에 그대로 남는다.
      - ./uploads:/app/uploads

    depends_on:
      db:
        # db 컨테이너가 단순히 "실행"만 된 상태가 아니라, healthcheck(상태 체크)를 통과해
        # "정상적으로 접속 가능"해진 뒤에 api를 실행한다.
        condition: service_healthy

  web:
    build: .
    container_name: booklib-web

    ports:
      - "8501:8501" # Streamlit의 기본 포트 번호

    environment:
      # 컨테이너 안에서 api컨테이너에 접속할 때는 localhost가 아니라
      # docker-compose.yml에 적은 서비스이름 "api"를 주소로 사용해야 한다.
      API_URL: http://api:8000

    depends_on:
      # api가 먼저 뜬 뒤 web을 실행
      - api

    command: >
      streamlit run streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501

  db:
    image: postgres:17
    container_name: booklib-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - booklib_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  booklib_pgdata:
