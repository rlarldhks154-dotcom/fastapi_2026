<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!--  block title : 자식 템플릿이 이 자리를 자기 제목으로 바꿔치기 한다. -->
  <title>{% block title %}상품 목록{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <!--  block content  : 실제 페이지 내용이 들어갈 자리, product.html이 채울 자리 -->
    {% block content %}{% endblock %}
  </div>
</body>
</html>
